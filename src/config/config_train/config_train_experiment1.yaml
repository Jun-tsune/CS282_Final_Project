training:
    # Fllowing "What Can Transformers Learn In-Context?"
    task: linear_regression
    data: gaussian
    task_kwargs: {}

    batch_size: 64
    train_steps: 20000

    curriculum:
        dims:
            start: 20
            end: 20
            inc: 1
            interval: 200000

        points:
            start: 41
            end: 41
            inc: 1
            interval: 200000

    # original setting
    learning_rate: 0.0003
    save_every_steps: 10000
    keep_every_steps: 100000
    resume_id: null
    device: cuda
